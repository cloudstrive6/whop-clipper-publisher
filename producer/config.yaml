instagram:
  # Meta app "Whop Clipper" (app id 966773169048932), Instagram API with Instagram Login
  token: secrets/instagram_tokens.json   # {"<handle>": {"token": "...", "user_id": "..."}}

# posts PER ACCOUNT per day, equally spaced by the scheduler (cron-job.org fires each slot)
cadence:
  youtube:   {per_day: 4, spacing_hours: 6}   # x3 channels  = 12 posts/day
  instagram: {per_day: 3, spacing_hours: 8}   # x3 accounts  =  9 posts/day
  tiktok:    {per_day: 4, spacing_hours: 6}   # x2 accounts  =  8 posts/day

postforme:
  # Post for Me project "Whop Clips" — routes TikTok drafts and X posts
  api_key_file: secrets/postforme_api_key.txt

llm:
  # claude_cli = uses your logged-in Claude Code (`claude -p`), no API key needed
  # api        = Anthropic API via ANTHROPIC_API_KEY
  backend: claude_cli
  model: claude-opus-5

scout:
  marketplace_url: https://whop.com/discover/app/app_QRxsQodZgK1r4D/
  # Only YouTube pay rates matter while we post to YouTube only
  platform: youtube
  min_cpm: 0.30             # $ per 1K views on YouTube
  min_budget_remaining: 500 # $
  min_budget_remaining_pct: 10
  max_views_to_min_payout: 20000  # skip if a clip needs more views than this before paying
  content_types: [clipping] # skip UGC (needs your face/voice)
  # marketplace searches per account niche (the featured page only shows ~20 campaigns). Niches whose
  # accounts have nothing to post get searched first, every run.
  search_queries_by_niche:
    gaming: [gaming streamer esports, twitch kick streamer clips, video game trailer, call of duty fortnite valorant minecraft, roblox gta gameplay]
    movies_tv: [movie tv show trailer, anime clips edits]
    crypto: [crypto trading finance, bitcoin crypto podcast]
    finance: [real estate investing money, business entrepreneur podcast, stocks day trading]
    manifestation: [manifestation law of attraction, spirituality meditation mindset]
    selfimprovement: [podcast mindset success motivation, self improvement discipline, motivational speaker]
    faith: [faith christian bible church, gospel worship jesus, christian podcast sermon pastor, prayer inspirational]
  # @PogingPanda is a gaming / playthrough / trailer channel: prefer campaigns in that niche
  preferred_niches: [gaming, esports, movies_tv, entertainment, crypto, finance, manifestation, selfimprovement, faith, christian, inspirational]
  avoid_niches: [gambling]   # channel-policy risk
  niche_regex: "gam|roblox|valorant|minecraft|fortnite|esport|stream|trailer|movie|film|prime video|netflix|anime|invincible|crypto|coin|token|trading|finance|wealth|mindset|manifest|motivat|self.?improv|discipline|faith|christ|church|bible|pastor|gospel|worship|pray"

editing:
  width: 1080
  height: 1920
  min_seconds: 15
  max_seconds: 58           # stays under 60s for Shorts
  clips_per_source: 5
  layout: blur              # blur = full frame over blurred background; crop = center crop to fill
  talking_head_4x5: true    # faces on screen: sharp 4:5 window that cuts to whoever is talking, feathered into the blurred full-screen copy
  captions: true
  hook_text: true
  bg_music_volume: 0.10     # used only if a track is found in assets/music
  whisper_model: small      # tiny | base | small | medium | large-v3
  whisper_device: auto      # auto | cuda | cpu
  whisper_model_long_ci: base  # CPU-only cloud runners: faster model for podcasts/VODs over 20 min
  font_ci: Archivo Black    # Arial Black isn't on Linux; the cloud producer installs this free font

# daily cloud producer (GitHub Actions, PC off): scout -> analyze -> join -> clip -> audit -> queue
produce:
  analyze_per_run: 10         # new campaign briefs read per run (each is one AI call + reference docs)
  auto_join: true             # join campaigns that pass the scout, fit an account and need no human steps
  max_new_clips_per_run: 40   # ~16 approved clips a day at a ~40% audit pass rate: every slot filled
  max_clips_per_campaign: 10  # per run, so one campaign can't take every slot
  buffer_days: 1.5            # keep each account's queue this many days of posts deep
  max_minutes: 230            # stop making clips after this long (the job times out at 300)
  allow_payout_paperwork: true   # also clip campaigns whose only human step comes at payout (you do that paperwork)
  max_source_mb: 1500         # skip single source files bigger than this
  channel_videos: 3           # when a campaign's source is a whole channel, take its N newest videos
  max_source_minutes: 90
  # campaigns to clip even though the brief has a human-only step (e.g. demographic proof at payout,
  # which you then provide yourself). Campaign ids as shown by: python -m clipper campaigns
  override_campaigns: []
  languages: [english, none]  # footage/audience languages the accounts can use
  searches_per_run: 1         # extra rotating search on top of one per niche with nothing to post
  max_searches_per_run: 6     # each search takes ~4 min
  alert_min_cpm: 1.5          # Telegram you about new campaigns that need a human step, if they pay this much
  alert_min_budget: 10000     # ...or have this much budget left
  auto_apply: true            # fill and submit applications for campaigns that need one (honest answers only)

youtube:
  client_secret: secrets/client_secret.json
  token: secrets/youtube_token.json
  privacy_on_upload: public
  max_uploads_per_day: 4    # per YouTube channel
  # post when US viewers are awake so each Short's first audience is Tier-1 (US Eastern hours, 24h clock)
  post_window_et: [12, 22]
  geo_location: "New York, NY"   # campaigns that require a geo-tag; set to your city if you prefer
  category_id: "24"         # Entertainment

# Facts the agent may use when filling campaign applications. Only true statements; it never invents
# numbers. Add anything else that's true and useful (follower counts, results, experience).
applicant:
  facts: |
    - We run a small network of niche pages and post clips every day, on a fixed schedule:
      YouTube Shorts 4 a day, Instagram Reels 3 a day, TikTok 4 a day, per account.
    - @PogingPanda (YouTube) is an established gaming / playthrough / trailer channel; about half of its
      audience is in the US (top countries: US ~44%, Philippines ~23%, UK ~3%, Canada ~2%).
    - @destinedforgreatness777 (YouTube) is a faith / Christian / inspirational channel with about 8.4K subscribers.
    - Other pages: @ericknox2802 (YouTube, crypto/finance), @iamcryptohustler (Instagram + TikTok, crypto/finance),
      @modernmanifestationsecrets (YouTube + Instagram, manifestation/self-improvement), @mnfsttnsecrets (TikTok,
      manifestation), @kiwinoygamer (Instagram, gaming), @iamdestinedforgreatness (TikTok, faith).
    - Every clip is cut from the campaign's own footage, captioned, given a hook, and checked against the
      campaign's rules and reference materials before it's posted. Posts stay up.

whop:
  submit_deadline_minutes: 30   # Whop's dialog: "Posted within the last 30 minutes"
  # dedicated automation browser profile (log in to Whop once)
  browser_profile: .browser-profile
