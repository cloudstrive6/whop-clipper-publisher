name: diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
      - env:
          WHOP_SESSION: ${{ secrets.WHOP_SESSION }}
        run: python diag_dialog.py "Buy Turnkey Investments from Harry Gold" "Michael Sartain's Clipping Army"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: artifacts/
