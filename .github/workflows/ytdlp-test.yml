name: ytdlp-test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          pip install -q "yt-dlp[default]"
          printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/c.txt"
          yt-dlp --version
          yt-dlp --cookies "$RUNNER_TEMP/c.txt" -f "bv*[height<=1080]+ba/b[height<=1080]/b" --merge-output-format mp4 \
            -o "$RUNNER_TEMP/%(id)s.%(ext)s" "https://youtu.be/s2DiMFT1DO0" 2>&1 | tail -15
          ls -la "$RUNNER_TEMP"/*.mp4
