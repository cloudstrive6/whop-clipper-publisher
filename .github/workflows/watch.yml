name: watch

# Every 4 hours: look for campaigns never seen before, read + join the ones that fit, and start a
# production run straight away if they can fill empty slots. A few minutes when nothing is new.
on:
  schedule:
    - cron: "40 2,6,10,14,18,22 * * *"   # every 4 hours
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write            # saves the producer database
  actions: write             # starts a production run when a new campaign can fill slots

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip while a production run is working (it searches too, and owns the database)
        id: busy
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow produce.yml --status in_progress --json databaseId -q length)
          echo "busy=$([ "$n" -gt 0 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.busy.outputs.busy == 'no'
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        if: steps.busy.outputs.busy == 'no'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            producer/requirements.txt
            requirements.txt

      - uses: actions/setup-node@v4
        if: steps.busy.outputs.busy == 'no'
        with:
          node-version: "22"

      - name: Install
        if: steps.busy.outputs.busy == 'no'
        run: |
          npm install -g @anthropic-ai/claude-code > /dev/null
          pip install -q -r requirements.txt -r producer/requirements.txt
          python -m playwright install --with-deps chromium > /dev/null

      - name: Look for new campaigns
        if: steps.busy.outputs.busy == 'no'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY_BACKUP: ${{ secrets.ANTHROPIC_API_KEY_BACKUP }}
          WHOP_SESSION: ${{ secrets.WHOP_SESSION }}
          PUBLISHER_DIR: ${{ github.workspace }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf '%s' "$WHOP_SESSION" > "$RUNNER_TEMP/whop_session.json"
          export WHOP_SESSION_FILE="$RUNNER_TEMP/whop_session.json"
          cd producer
          python -u -m clipper watch

      - name: Keep Whop's refreshed login
        if: steps.busy.outputs.busy == 'no' && always()
        env:
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
        run: python renew.py whop-save "$RUNNER_TEMP/whop_session.json"

      - name: Record results
        if: steps.busy.outputs.busy == 'no' && always()
        run: |
          git config user.name "whop-clipper"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "watch: $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs && git push && exit 0
            sleep 5
          done
          echo "::error::could not push watcher state"; exit 1
