name: renew

# Credential check on demand (the daily produce run does the same before it starts).
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
      - name: Whop login
        env:
          WHOP_SESSION: ${{ secrets.WHOP_SESSION }}
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python renew.py whop-check
      - name: Instagram tokens
        env:
          INSTAGRAM_TOKENS: ${{ secrets.INSTAGRAM_TOKENS }}
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python renew.py instagram
